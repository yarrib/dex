[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
authors = ["yarrib"]
repository = "https://github.com/yarrib/dex"

[workspace.dependencies]
# Internal
dex-core = { path = "crates/dex-core" }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
indexmap = { version = "2", features = ["serde"] }

# Template engine
minijinja = { version = "2", features = ["loader"] }

# Error handling
thiserror = "2"

# Filesystem
walkdir = "2"
include_dir = { version = "0.7", features = ["glob"] }
regex = "1"
dirs = "6"
shellexpand = "3"

# CLI
clap = { version = "4", features = ["derive"] }
dialoguer = { version = "0.11", features = ["fuzzy-select"] }
console = "0.15"
indicatif = "0.17"

# Testing
insta = { version = "1", features = ["yaml"] }
tempfile = "3"
assert_cmd = "2"
