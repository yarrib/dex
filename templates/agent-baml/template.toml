[template]
name = "agent-baml"
description = "AI agent — BAML typed functions, MLflow tracing, Databricks Asset Bundle deployment"
version = "0.1.0"
min_dex_version = "0.1.0"

[[variables]]
name = "project_name"
prompt = "Project name"
type = "string"
required = true
validate = "^[a-z][a-z0-9_]*$"

[[variables]]
name = "description"
prompt = "What does this agent do? (one sentence)"
type = "string"
required = true

[[variables]]
name = "python_version"
prompt = "Python version"
type = "choice"
choices = ["3.12", "3.11"]
default = "3.12"
required = false

[[variables]]
name = "trigger"
prompt = "What triggers the agent?"
type = "choice"
choices = ["user_request", "schedule", "event", "upstream_system"]
default = "user_request"
required = false

[[variables]]
name = "success_criteria"
prompt = "What does success look like?"
type = "string"
required = false

[[variables]]
name = "reads"
prompt = "What does it need to read? (tables, APIs, files)"
type = "string"
required = false

[[variables]]
name = "writes"
prompt = "What does it need to write or change?"
type = "string"
required = false

[[variables]]
name = "autonomous"
prompt = "Act autonomously (vs confirm before acting)?"
type = "bool"
default = true
required = false

[[variables]]
name = "example_input"
prompt = "Example input"
type = "string"
required = false

[[variables]]
name = "example_output"
prompt = "Expected behavior for the example input"
type = "string"
required = false

[[variables]]
name = "bad_output"
prompt = "What would a bad or dangerous output look like?"
type = "string"
required = false

[[variables]]
name = "deploy_target"
prompt = "Deployment target"
type = "choice"
choices = ["job", "serving_endpoint"]
default = "job"
required = false

[[variables]]
name = "ai_tools"
prompt = "Which AI coding assistants should this project support?"
type = "multi"
choices = ["claude", "cursor", "copilot", "generic"]
default = "claude,cursor,copilot,generic"
required = false

[[variables]]
name = "include_mcp"
prompt = "Include a .mcp.json for MCP-capable tools (Claude Code, Claude Desktop, Cursor)?"
type = "bool"
default = true
required = false

[skills]
packs = ["default", "agent-dev"]

[[files]]
src = ".mcp.json.j2"
condition = "include_mcp"
context_role = "ai_config"
context_description = "MCP server config for AI coding assistants"

[[files]]
src = "AGENTS.md.j2"
context_role = "ai_doc"
context_description = "Canonical agent-orientation doc for any AI coding assistant"

[on_success]
run = "dex skills init --yes --packs default,agent-dev --targets {{ ai_tools }}"
message = """
Skills installed. Next steps:
  cd {{ project_name }}
  uv sync
  uv run baml generate
  uv run pytest
  uv run python evals/runner.py

Open the project in your AI coding assistant (Claude Code, Cursor, Copilot,
or any MCP client) and read AGENTS.md to get oriented.
"""
