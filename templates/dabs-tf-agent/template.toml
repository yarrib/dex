[template]
name = "dabs-tf-agent"
description = "Databricks Asset Bundle Terraform agent — agentic IaC that drafts & updates Terraform and opens PRs (GitHub or Azure DevOps), OBO user / managed-identity auth, MLflow-traced"
version = "0.1.0"
min_dex_version = "0.1.0"

# --- Identity ---------------------------------------------------------------

[[variables]]
name = "project_name"
prompt = "Project name"
type = "string"
required = true
validate = "^[a-z][a-z0-9_]*$"

[[variables]]
name = "description"
prompt = "What should this agent manage? (one sentence)"
type = "string"
default = "Agentically create and update Terraform for our Databricks platform"
required = false

[[variables]]
name = "python_version"
prompt = "Python version"
type = "choice"
choices = ["3.12", "3.11"]
default = "3.12"
required = false

# --- Cloud & Terraform ------------------------------------------------------

[[variables]]
name = "cloud"
prompt = "Cloud provider"
type = "choice"
choices = ["azure", "aws", "gcp"]
default = "azure"
required = false

[[variables]]
name = "tf_dir"
prompt = "Path to the Terraform root inside the repo"
type = "string"
default = "terraform"
required = false

[[variables]]
name = "tf_backend"
prompt = "Terraform state backend"
type = "choice"
choices = ["azurerm", "s3", "gcs", "local"]
default = "azurerm"
required = false

[[variables]]
name = "manage_databricks_provider"
prompt = "Manage Databricks workspace resources via the databricks Terraform provider?"
type = "bool"
default = true
required = false

# --- Git host (the dynamic, host-specific part of the form) -----------------

[[variables]]
name = "git_host"
prompt = "Where does the Terraform repo live?"
type = "choice"
choices = ["github", "azure_devops"]
default = "github"
required = false

[[variables]]
name = "github_owner"
prompt = "GitHub owner / org"
type = "string"
required = false
when = "git_host == 'github'"

[[variables]]
name = "github_repo"
prompt = "GitHub repository name (the Terraform repo to manage)"
type = "string"
required = false
when = "git_host == 'github'"

[[variables]]
name = "ado_org"
prompt = "Azure DevOps organization"
type = "string"
required = false
when = "git_host == 'azure_devops'"

[[variables]]
name = "ado_project"
prompt = "Azure DevOps project"
type = "string"
required = false
when = "git_host == 'azure_devops'"

[[variables]]
name = "ado_repo"
prompt = "Azure DevOps repository name (the Terraform repo to manage)"
type = "string"
required = false
when = "git_host == 'azure_devops'"

[[variables]]
name = "default_branch"
prompt = "Base branch for pull requests"
type = "string"
default = "main"
required = false

# --- Auth -------------------------------------------------------------------

[[variables]]
name = "enable_obo"
prompt = "Use on-behalf-of (OBO) the calling user's identity for interactive runs?"
type = "bool"
default = true
required = false

[[variables]]
name = "headless_auth"
prompt = "Identity to use for headless (scheduled/job) runs"
type = "choice"
choices = ["managed_identity", "service_principal", "oidc"]
default = "managed_identity"
required = false

[[variables]]
name = "secret_scope"
prompt = "Databricks secret scope holding the git token (service-principal fallback)"
type = "string"
default = "tf_agent"
required = false

# --- Behavior ---------------------------------------------------------------

[[variables]]
name = "llm_provider"
prompt = "Model backend for drafting Terraform"
type = "choice"
choices = ["databricks", "anthropic"]
default = "databricks"
required = false

[[variables]]
name = "autonomous"
prompt = "Open the pull request automatically (vs. confirm first)?"
type = "bool"
default = true
required = false

[[variables]]
name = "allow_auto_merge"
prompt = "Allow the agent to enable auto-merge once checks pass?"
type = "bool"
default = false
required = false

[[variables]]
name = "run_terraform_plan"
prompt = "Run `terraform plan` and attach it to the pull request?"
type = "bool"
default = true
required = false

[[variables]]
name = "deploy_serving"
prompt = "Also expose the agent as a model serving endpoint (vs. job only)?"
type = "bool"
default = false
required = false

# --- AI coding surfaces -----------------------------------------------------

[[variables]]
name = "ai_tools"
prompt = "Which AI coding assistants should this project support?"
type = "multi"
choices = ["claude", "cursor", "copilot", "generic"]
default = "claude,cursor,copilot,generic"
required = false

[[variables]]
name = "include_mcp"
prompt = "Include a .mcp.json for MCP-capable tools (Claude Code, Cursor)?"
type = "bool"
default = true
required = false

[skills]
packs = ["default", "agent-dev", "databricks"]

[[files]]
src = ".mcp.json.j2"
condition = "include_mcp"
context_role = "ai_config"
context_description = "MCP server config for AI coding assistants"

[[files]]
src = "resources/{{ project_name }}_serving.yml.j2"
condition = "deploy_serving"
context_role = "deploy"
context_description = "Optional model serving endpoint for the agent"

[[files]]
src = "AGENTS.md.j2"
context_role = "ai_doc"
context_description = "Canonical agent-orientation doc for any AI coding assistant"

[[files]]
src = "src/{{ project_name }}/agent.py.j2"
context_role = "entry_point"
context_description = "Agent entry point: plan -> draft TF -> validate -> open PR"

[on_success]
message = """
Next steps:
  cd {{ project_name }}
  uv sync
  uv run pytest

Configure the git token + workspace before the first deploy:
  databricks secrets create-scope {{ secret_scope }}
  databricks secrets put-secret {{ secret_scope }} git_token

Local dry run (drafts a change, no PR):
  uv run python -m {{ project_name }}.agent --dry-run "add a unity catalog schema named analytics"

Deploy the bundle:
  databricks bundle deploy --target dev

Open the project in your AI coding assistant (Claude Code, Codex, Cursor, or any
MCP client) and read AGENTS.md to get oriented.
"""
