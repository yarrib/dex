[template]
name = "databricks-app-streamlit"
description = "Databricks Apps + Streamlit — hosted web app with Unity Catalog and SDK access"
version = "0.1.0"
min_dex_version = "0.1.0"

[[variables]]
name = "project_name"
prompt = "Project name"
type = "string"
required = true
validate = "^[a-z][a-z0-9_]*$"

[[variables]]
name = "python_version"
prompt = "Python version"
type = "choice"
choices = ["3.12", "3.11"]
default = "3.12"
required = false

[[variables]]
name = "warehouse_id"
prompt = "SQL warehouse ID for data queries (leave blank to set later)"
type = "string"
default = ""
required = false

[[variables]]
name = "include_auth"
prompt = "Include Databricks OAuth authentication?"
type = "bool"
default = true
required = false
