[template]
name = "dabs-dashboard"
description = "Databricks Asset Bundle Lakeview dashboard project"
version = "0.1.0"
min_dex_version = "0.1.0"

[[variables]]
name = "project_name"
prompt = "Project name"
type = "string"
required = true
validate = "^[a-z][a-z0-9_]*$"

[[variables]]
name = "python_version"
prompt = "Python version"
type = "choice"
choices = ["3.12", "3.11"]
default = "3.12"
required = false

[[variables]]
name = "warehouse_id"
prompt = "SQL warehouse ID (leave blank to set later)"
type = "string"
default = ""
required = false

[[variables]]
name = "include_notebook"
prompt = "Include exploration notebook?"
type = "bool"
default = true
required = false

[[files]]
src = "notebooks/"
condition = "include_notebook"
