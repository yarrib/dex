name: Deploy docs

on:
  # Update the site (including the "Unreleased" changelog section) on every merge.
  push:
    branches: [main]
  # Redeploy after a release finishes, so the changelog regenerates with the new
  # tag present and the just-released commits land under their version heading
  # (rather than "Unreleased"). The tag itself is pushed by GITHUB_TOKEN in
  # tag-on-merge.yml, which can't trigger workflows — so we key off Release here.
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write  # deploy to gh-pages branch

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # git-cliff needs full history

      - name: Install mdBook
        uses: taiki-e/install-action@v2
        with:
          tool: mdbook

      - name: Install git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      - name: Generate changelog
        run: git-cliff --output docs/changelog.md
        env:
          GITHUB_REPO: ${{ github.repository }}

      - name: Build docs
        run: mdbook build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./book
