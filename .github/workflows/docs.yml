name: Deploy docs

on:
  # Update the site (including the "Unreleased" changelog section) on every merge.
  push:
    branches: [main]
  # On release, tag-on-merge.yml dispatches this workflow AFTER pushing the tag,
  # so the changelog regenerates with the new tag present and the released commits
  # land under their version heading instead of "Unreleased". (A workflow_run
  # trigger can't be used: the Release run is dispatched with GITHUB_TOKEN, which
  # by GitHub's loop-prevention rule emits no workflow_run event.)
  workflow_dispatch:

permissions:
  contents: write  # deploy to gh-pages branch

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # git-cliff needs full history

      - name: Install mdBook
        uses: taiki-e/install-action@v2
        with:
          tool: mdbook

      - name: Install mdbook-mermaid
        uses: taiki-e/install-action@v2
        with:
          tool: mdbook-mermaid

      - name: Install git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      - name: Generate changelog
        run: git-cliff --output docs/changelog.md
        env:
          GITHUB_REPO: ${{ github.repository }}

      - name: Generate knowledge graph
        run: python3 scripts/gen_context_graph.py

      - name: Install mermaid assets
        run: mdbook-mermaid install .

      - name: Build docs
        run: mdbook build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./book
