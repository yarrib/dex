name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    name: Validate tag and version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag format
        run: |
          TAG="${GITHUB_REF_NAME}"
          if ! echo "${TAG}" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Error: tag '${TAG}' does not match v<major>.<minor>.<patch>"
            exit 1
          fi

      - name: Verify Cargo.toml version matches tag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CARGO_VERSION="$(grep '^version = ' crates/dex-cli/Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')"
          if [ "${TAG_VERSION}" != "${CARGO_VERSION}" ]; then
            echo "Error: tag version '${TAG_VERSION}' does not match crates/dex-cli/Cargo.toml version '${CARGO_VERSION}'"
            echo "Run 'bash scripts/bump-version.sh ${TAG_VERSION}' locally and commit before tagging."
            exit 1
          fi

  changelog:
    name: Generate changelog
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      - name: Generate changelog with git-cliff
        run: git-cliff --latest --strip header --output CHANGELOG_RELEASE.md
        env:
          GITHUB_REPO: ${{ github.repository }}

      - uses: actions/upload-artifact@v4
        with:
          name: changelog
          path: CHANGELOG_RELEASE.md

  build-binaries:
    name: Build binary (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    needs: validate
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact: dex-linux-x86_64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: dex-macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: dex-macos-aarch64
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install musl tools (Linux)
        if: contains(matrix.target, 'musl')
        run: sudo apt-get install -y musl-tools

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }} -p dex-cli

      - name: Rename binary
        run: cp target/${{ matrix.target }}/release/dex ${{ matrix.artifact }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    name: Create GitHub Release
    needs: [changelog, build-binaries]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dex-*
          merge-multiple: true
          path: dist/

      - uses: actions/download-artifact@v4
        with:
          name: changelog
          path: .

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: CHANGELOG_RELEASE.md
