name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 0.1.1 — must match Cargo.toml)'
        required: true

permissions:
  contents: write

jobs:
  prepare:
    name: Resolve tag and version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Resolve tag
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
            VERSION="${VERSION#v}"
            TAG="v${VERSION}"
          else
            TAG="${GITHUB_REF_NAME}"
            VERSION="${TAG#v}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

  validate:
    name: Validate tag and version
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - uses: actions/checkout@v4

      - name: Check tag format
        run: |
          TAG="${{ needs.prepare.outputs.tag }}"
          if ! echo "${TAG}" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Error: tag '${TAG}' does not match v<major>.<minor>.<patch>"
            exit 1
          fi

      - name: Verify Cargo.toml version matches tag
        run: |
          TAG_VERSION="${{ needs.prepare.outputs.version }}"
          CARGO_VERSION="$(grep '^version = ' crates/dex-cli/Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')"
          if [ "${TAG_VERSION}" != "${CARGO_VERSION}" ]; then
            echo "Error: tag version '${TAG_VERSION}' does not match crates/dex-cli/Cargo.toml version '${CARGO_VERSION}'"
            echo "Run 'bash scripts/bump-version.sh ${TAG_VERSION}' locally and commit before tagging."
            exit 1
          fi

  changelog:
    name: Generate changelog
    runs-on: ubuntu-latest
    needs: [prepare, validate]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      - name: Generate changelog with git-cliff
        run: git-cliff --latest --strip header --output CHANGELOG_RELEASE.md
        env:
          GITHUB_REPO: ${{ github.repository }}
          # git-cliff's GitHub integration (enabled by GITHUB_REPO) enriches the
          # changelog with PR/author metadata via the GitHub API. Without a token
          # those calls are unauthenticated and hit the 60 req/hr rate limit,
          # which surfaces as an HTTP 403 and a hard panic. Authenticate them.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote lightweight tag to annotated with changelog
        run: |
          TAG="${{ needs.prepare.outputs.tag }}"
          # Only promote if the tag is lightweight (cat-file type == "commit").
          # Annotated tags (type == "tag") already carry a message — leave them.
          if [ "$(git cat-file -t "$TAG")" = "tag" ]; then
            echo "Tag $TAG is already annotated — leaving as-is."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            printf 'Release %s\n\n' "$TAG" > TAG_MESSAGE.md
            cat CHANGELOG_RELEASE.md >> TAG_MESSAGE.md
            git tag -a -f -F TAG_MESSAGE.md "$TAG" "$TAG"
            git push origin -f "refs/tags/$TAG"
            echo "Promoted $TAG from lightweight to annotated tag with changelog."
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: changelog
          path: CHANGELOG_RELEASE.md

  build-binaries:
    name: Build binary (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    needs: [prepare, validate]
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact: dex-linux-x86_64
            build_cmd: cross
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            artifact: dex-linux-aarch64
            build_cmd: cross
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: dex-macos-x86_64
            build_cmd: cargo
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: dex-macos-aarch64
            build_cmd: cargo
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.build_cmd == 'cross'
        run: cargo install cross --locked

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release binary
        run: ${{ matrix.build_cmd }} build --release --target ${{ matrix.target }} -p dex-cli

      - name: Rename binary
        run: cp target/${{ matrix.target }}/release/dex ${{ matrix.artifact }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    name: Create GitHub Release
    needs: [prepare, changelog, build-binaries]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dex-*
          merge-multiple: true
          path: dist/

      - uses: actions/download-artifact@v4
        with:
          name: changelog
          path: .

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: ${{ needs.prepare.outputs.tag }}
          files: dist/*
          body_path: CHANGELOG_RELEASE.md
          # Publish as a draft: binaries + notes are built automatically, but a
          # human reviews and clicks "Publish" before the release goes public.
          draft: true
